[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrosearch"
version = "0.2.0"
description = "Astronomical catalog crossmatching and dataset generation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "astropy>=6.0.0",
    "PyYAML>=6.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "tenacity>=8.2.0",
    "prometheus-client>=0.19.0",
    "PyJWT[crypto]>=2.9.0",
    "httpx-sse>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
storage = [
    "psycopg[binary]>=3.2.0",
    "boto3>=1.35.0",
]
worker = [
    "rq>=2.0.0",
]

[project.scripts]
astrosearch = "main:main"
astrosearch-astronomy = "astronomy_pipeline:main"
astrosearch-signals = "signal_pipeline:main"

[tool.setuptools]
py-modules = ["models", "providers", "crossmatch", "datasets", "api", "main", "astronomy", "astronomy_pipeline", "representations", "signal_pipeline", "tess_adapter"]

[tool.ruff]
line-length = 140

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
