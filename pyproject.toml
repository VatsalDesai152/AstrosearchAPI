[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrosearch"
version = "0.2.0"
description = "Astronomical catalog crossmatching and dataset generation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "astropy>=6.0.0",
    "PyYAML>=6.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "prometheus-client>=0.19.0",
    "PyJWT[crypto]>=2.9.0",
    "matplotlib>=3.8",
    "astroquery>=0.4.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "fakeredis[lua]>=2.23.0",
    "rq>=2.0.0",
]
storage = [
    "psycopg[binary]>=3.2.0",
    "boto3>=1.35.0",
]
worker = [
    "rq>=2.0.0",
]

[project.scripts]
astrosearch = "main:main"
astrosearch-astronomy = "astronomy:main"
astrosearch-signals = "signals:main"
astrosearch-plot-catalogs = "astronomy:plot_main"
astrosearch-tess = "tess:main"

[tool.setuptools]
py-modules = ["core", "datasets", "api", "main", "astronomy", "signals", "tess"]
license-files = ["LICENSE"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
