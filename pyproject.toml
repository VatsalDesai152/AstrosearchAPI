[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrosearch"
version = "0.3.0"
description = "Astronomical catalog crossmatching, time-domain, imaging, VO services and dataset generation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # HTTP, API server and validation
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "starlette>=0.40.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "PyJWT[crypto]>=2.9.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "redis>=5.0.0",
    "PyYAML>=6.0.1",  # 6.0.0 does not build on Python 3.12
    # Science stack. astropy 8 is the first release whose fast Lomb-Scargle gives the same powers on
    # sub-grids of a regular frequency grid (timedomain.ls_power evaluates it in chunks); it needs
    # numpy 2, so the other compiled packages start at their first numpy-2 builds with Python 3.12 wheels.
    "numpy>=2.0",
    "scipy>=1.13.0",
    "astropy>=8.0",
    "pyerfa>=2.0.1.3",
    "astropy-healpix>=1.0.3",
    "pandas>=2.2.2",
    "pyarrow>=16.0.0",
    "Pillow>=10.1",
    # Claude (ai.py: natural-language queries and explanations)
    "anthropic>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.21.0",
    "httpx-sse>=0.4.0",
    "pyvo>=1.5.3",  # 1.5.0-1.5.2 cannot read a TAP service's VOSI capabilities (test_pyvo_tap_sync_async_and_metadata)
    "cdshealpix>=0.7",
    "matplotlib>=3.9",
    # tests/test_vo_server.py validates the VO documents against the IVOA XML schemas
    "lxml>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
# SED plots (astrosearch sed --plot, sed.plot_sed)
plot = [
    "matplotlib>=3.9",
]
# Remote HATS catalogs (skycache.HatsRemoteProvider) and the HATS/lsdb compatibility tests
skycache-hats = [
    "lsdb>=0.11",
]
storage = [
    "psycopg[binary]>=3.2.0",
    "boto3>=1.35.0",
]
worker = [
    "rq>=2.0.0",
]

[project.scripts]
astrosearch = "cli:main"
astrosearch-astronomy = "astronomy_pipeline:main"
astrosearch-signals = "signal_pipeline:main"

[tool.setuptools]
py-modules = [
    "models", "providers", "crossmatch", "astrometry", "streaming", "batch", "skycache", "vizier", "sed",
    "timedomain", "imaging", "ai", "provenance", "vo_server", "alerts", "datasets", "api", "cli", "main",
    "astronomy", "astronomy_pipeline", "representations", "signal_pipeline", "tess_adapter",
]

# The web UI (served at '/'). An editable install or a checkout serves web/ next to imaging.py;
# a wheel installs it under <prefix>/share/astrosearch/web, which api.py finds too
# (ASTROSEARCH_WEB_DIR overrides both).
[tool.setuptools.data-files]
"share/astrosearch/web" = ["web/index.html", "web/app.js", "web/styles.css"]

[tool.ruff]
line-length = 140

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
    "live: hits real public astronomy archives over the network (run with -m live)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
]
